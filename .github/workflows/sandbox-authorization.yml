name: Sandbox Authorization

on:
  pull_request:
    paths:
      - src/services/sandboxAuthorizationService.js
      - src/routes/sandboxAuthorization.js
      - src/routes/admin/sandboxGrants.js
      - src/routes/admin/apiKeys.js
      - src/routes/admin/index.js
      - src/app.js
      - src/middleware/auth.js
      - src/middleware/authLogPolicy.js
      - src/middleware/browserFallback.js
      - src/models/redis.js
      - tests/sandboxAuthorization*.test.js
      - tests/sensitiveAuthLogging.test.js
      - package*.json
      - .github/workflows/sandbox-authorization.yml
  push:
    branches: [dev]
    paths:
      - src/services/sandboxAuthorizationService.js
      - src/routes/sandboxAuthorization.js
      - src/routes/admin/sandboxGrants.js
      - src/routes/admin/apiKeys.js
      - src/middleware/auth.js
      - src/middleware/authLogPolicy.js
      - src/middleware/browserFallback.js
      - tests/sandboxAuthorization*.test.js
      - tests/sensitiveAuthLogging.test.js
      - .github/workflows/sandbox-authorization.yml

permissions:
  contents: read

jobs:
  authorization:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check changed authorization sources
        run: npx eslint src/services/sandboxAuthorizationService.js src/routes/sandboxAuthorization.js src/routes/admin/sandboxGrants.js src/routes/admin/apiKeys.js src/middleware/auth.js src/middleware/authLogPolicy.js src/middleware/browserFallback.js src/app.js src/routes/admin/index.js
      - name: Verify isolated authorization and existing management contracts
        run: npm test -- --runInBand tests/sandboxAuthorization.test.js tests/sandboxAuthorizationRoutes.test.js tests/sandboxAuthorizationKeyPermissions.test.js tests/apiKeyServiceOpenAIResponsesConfig.test.js tests/sensitiveAuthLogging.test.js tests/codexManagementAuth.test.js tests/codexManagementKeys.test.js
